services:
  nestjs:
    build:
      context: .
      args:
        - HTTP_PROXY=http://karelmb:03032766003@10.12.0.205:3128
        - HTTPS_PROXY=http://karelmb:03032766003@10.12.0.205:3128
    ports:
      - "3000:3000"
    links:
      - monguito
  monguito:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=karel
      - MONGO_INITDB_ROOT_PASSWORD=12345678
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data: